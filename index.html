<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波羅的海十八日</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B29;
  --parchment:#F2EADA;
  --parchment-2:#FBF7EE;
  --amber:#C97B2E;
  --amber-deep:#8A5017;
  --amber-tint:#F5E3C9;
  --juniper:#3F6357;
  --juniper-deep:#25382F;
  --juniper-tint:#DDE7DE;
  --rowan:#A23E2C;
  --rowan-deep:#6E2A1D;
  --rowan-tint:#F0DAD1;
  --ash:#88837A;
  --line:#DCD3BE;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--parchment);
  color:var(--ink);
  font-family:'Noto Sans TC',sans-serif;
  padding:0 0 4rem;
}
.wrap{max-width:760px;margin:0 auto;padding:0 20px;}
.hero{
  padding:2.6rem 20px 1.6rem;
  text-align:center;
  border-bottom:1px solid var(--line);
  margin-bottom:1.6rem;
}
.hero h1{
  font-family:'Noto Serif TC',serif;
  font-weight:700;
  font-size:30px;
  margin:0 0 6px;
  letter-spacing:1px;
}
.hero p{
  margin:0;
  color:var(--ash);
  font-size:13px;
  letter-spacing:2px;
}
.tabs{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:1.4rem 0 0;
}
.tab-btn{
  font-family:'Noto Serif TC',serif;
  font-size:15px;
  padding:9px 22px;
  border-radius:999px;
  border:1px solid var(--ink);
  background:transparent;
  color:var(--ink);
  cursor:pointer;
}
.tab-btn.active{background:var(--ink);color:var(--parchment-2);}
.view{display:none;}
.view.active{display:block;}

.legend{display:flex;gap:14px;justify-content:center;margin:0 0 18px;flex-wrap:wrap;}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ash);}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.dot.latvia{background:var(--amber);}
.dot.estonia{background:var(--juniper);}
.dot.lithuania{background:var(--rowan);}

.stamprow{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:6px 4px 18px;
  scrollbar-width:thin;
}
.stamp{
  flex:0 0 auto;
  width:56px;height:56px;
  border-radius:50%;
  border:2px dashed var(--ash);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
  background:var(--parchment-2);
  font-family:'JetBrains Mono',monospace;
  transform:rotate(-2deg);
  transition:transform .15s ease;
}
.stamp:nth-child(3n){transform:rotate(2deg);}
.stamp:nth-child(3n+1){transform:rotate(-1.5deg);}
.stamp .d{font-size:15px;font-weight:600;line-height:1;}
.stamp .m{font-size:9px;color:var(--ash);margin-top:2px;}
.stamp.latvia{border-color:var(--amber);}
.stamp.estonia{border-color:var(--juniper);}
.stamp.lithuania{border-color:var(--rowan);}
.stamp.active{
  border-style:solid;
  transform:rotate(0deg) scale(1.08);
}
.stamp.active.latvia{background:var(--amber);color:#fff;}
.stamp.active.estonia{background:var(--juniper);color:#fff;}
.stamp.active.lithuania{background:var(--rowan);color:#fff;}
.stamp.active .m{color:rgba(255,255,255,.85);}

.daycard{
  background:var(--parchment-2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:26px 26px 22px;
}
.daycard .top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:2px;}
.daycard .daylabel{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ash);letter-spacing:1px;}
.daycard .date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ash);}
.daycard h2{font-family:'Noto Serif TC',serif;font-size:26px;margin:2px 0 10px;}
.tag{
  display:inline-block;
  font-size:11px;
  padding:3px 10px;
  border-radius:999px;
  margin-right:6px;
  margin-bottom:14px;
}
.tag.latvia{background:var(--amber-tint);color:var(--amber-deep);}
.tag.estonia{background:var(--juniper-tint);color:var(--juniper-deep);}
.tag.lithuania{background:var(--rowan-tint);color:var(--rowan-deep);}
.stay{
  font-size:13px;color:var(--ash);margin-bottom:16px;
  padding-bottom:16px;border-bottom:1px solid var(--line);
}
.stay b{color:var(--ink);font-weight:500;}
.theme{font-size:14.5px;line-height:1.8;margin-bottom:18px;}
.blocks{display:flex;flex-direction:column;gap:14px;}
.block{display:flex;gap:14px;}
.block .time{
  flex:0 0 78px;
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;color:var(--ash);
  padding-top:2px;
}
.block .body{flex:1;font-size:13.5px;line-height:1.65;border-left:2px solid var(--line);padding-left:14px;}
.block .body .act{margin-bottom:3px;}
.block .meta{font-size:11.5px;color:var(--ash);}
.block .meta span{margin-right:10px;}
.note{
  margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ash);line-height:1.7;
}
.navrow{display:flex;justify-content:space-between;margin-top:16px;}
.navbtn{
  font-family:'Noto Sans TC',sans-serif;
  font-size:13px;padding:8px 16px;border-radius:8px;
  border:1px solid var(--line);background:var(--parchment-2);cursor:pointer;
}
.navbtn:disabled{opacity:.35;cursor:default;}

.panel{
  background:var(--parchment-2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:22px 24px;
  margin-bottom:18px;
}
.panel h3{
  font-family:'Noto Serif TC',serif;font-size:17px;margin:0 0 14px;
}
.travelers{display:flex;gap:10px;flex-wrap:wrap;}
.travelers input{
  flex:1;min-width:100px;
  padding:9px 10px;border:1px solid var(--line);border-radius:8px;
  font-family:'Noto Sans TC',sans-serif;font-size:13px;background:#fff;
}
.form-grid{display:flex;flex-direction:column;gap:10px;}
.form-row{display:flex;gap:10px;}
.form-row input[type=text], .form-row input[type=number]{
  flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
  font-family:'Noto Sans TC',sans-serif;font-size:13px;background:#fff;
}
.form-row input[type=number]{font-family:'JetBrains Mono',monospace;}
.paidby{display:flex;gap:8px;flex-wrap:wrap;}
.chip-select{
  padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  font-size:12.5px;cursor:pointer;background:#fff;color:var(--ash);
}
.chip-select.on{background:var(--ink);color:var(--parchment-2);border-color:var(--ink);}
.split-label{font-size:12px;color:var(--ash);margin-top:2px;}
.addbtn{
  margin-top:4px;
  padding:10px;border-radius:8px;border:none;background:var(--amber);
  color:#fff;font-size:13.5px;font-weight:500;cursor:pointer;
}
.ledger{width:100%;border-collapse:collapse;margin-top:6px;}
.ledger th{
  text-align:left;font-size:11px;color:var(--ash);font-weight:500;
  padding:6px 4px;border-bottom:1px solid var(--line);
}
.ledger td{
  padding:9px 4px;font-size:12.5px;border-bottom:1px solid var(--line);
  vertical-align:top;
}
.ledger td.amt{font-family:'JetBrains Mono',monospace;text-align:right;white-space:nowrap;}
.ledger td.del{text-align:right;}
.ledger td.del button{
  border:none;background:none;color:var(--ash);cursor:pointer;font-size:12px;
}
.empty{color:var(--ash);font-size:13px;padding:10px 0;}
.balance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.balcard{
  background:var(--parchment);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;
}
.balcard .name{font-size:12.5px;color:var(--ash);margin-bottom:4px;}
.balcard .val{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;}
.val.pos{color:var(--juniper-deep);}
.val.neg{color:var(--rowan-deep);}
.val.zero{color:var(--ash);}
.settle-line{
  display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;
  border-bottom:1px solid var(--line);
}
.settle-line:last-child{border-bottom:none;}
.settle-line .arrow{color:var(--amber);font-family:'JetBrains Mono',monospace;}
.foot-note{font-size:11.5px;color:var(--ash);text-align:center;margin-top:6px;line-height:1.7;}
</style>
</head>
<body>

<div class="hero">
  <h1>波羅的海十八日</h1>
  <p>RIGA · PÄRNU · TALLINN · VILNIUS · TRAKAI</p>
  <div class="tabs">
    <button class="tab-btn active" data-tab="itinerary">行程</button>
    <button class="tab-btn" data-tab="expense">分帳</button>
  </div>
</div>

<div class="wrap">

  <div class="view active" id="view-itinerary">
    <div class="legend">
      <span><i class="dot latvia"></i>拉脫維亞</span>
      <span><i class="dot estonia"></i>愛沙尼亞</span>
      <span><i class="dot lithuania"></i>立陶宛</span>
    </div>
    <div class="stamprow" id="stamprow"></div>
    <div class="daycard" id="daycard"></div>
    <div class="navrow">
      <button class="navbtn" id="prevBtn">← 前一天</button>
      <button class="navbtn" id="nextBtn">後一天 →</button>
    </div>
  </div>

  <div class="view" id="view-expense">
    <div class="panel">
      <h3>旅伴</h3>
      <div class="travelers">
        <input id="t0" placeholder="旅伴 A 姓名/暱稱">
        <input id="t1" placeholder="旅伴 B 姓名/暱稱">
        <input id="t2" placeholder="旅伴 C 姓名/暱稱">
      </div>
    </div>

    <div class="panel">
      <h3>新增支出</h3>
      <div class="form-grid">
        <div class="form-row">
          <input type="text" id="descInput" placeholder="例如：里加中央市場採買">
          <input type="number" id="amtInput" placeholder="金額 (EUR)" min="0" step="0.01" style="max-width:130px;">
        </div>
        <div>
          <div class="split-label">由誰先付</div>
          <div class="paidby" id="paidbyRow"></div>
        </div>
        <div>
          <div class="split-label">平分對象（預設全員）</div>
          <div class="paidby" id="splitRow"></div>
        </div>
        <div id="formError" style="color:var(--rowan-deep);font-size:12px;display:none;"></div>
        <button class="addbtn" id="addExpenseBtn">加入支出</button>
      </div>
    </div>

    <div class="panel">
      <h3>支出明細</h3>
      <table class="ledger" id="ledgerTable">
        <thead><tr><th>項目</th><th>付款人</th><th style="text-align:right;">金額</th><th></th></tr></thead>
        <tbody id="ledgerBody"></tbody>
      </table>
      <div class="empty" id="ledgerEmpty">還沒有任何支出紀錄。</div>
    </div>

    <div class="panel">
      <h3>目前餘額</h3>
      <div class="balance-grid" id="balanceGrid"></div>
    </div>

    <div class="panel">
      <h3>建議結算</h3>
      <div id="settleList"></div>
    </div>

    <p class="foot-note">
      資料只儲存在你目前使用的裝置／帳號中，不會自動同步給其他兩位旅伴。<br>
      若需要三人共用同一份帳目，建議其中一人統一在同一裝置上記錄，或定期截圖同步。
    </p>
  </div>

</div>

];

const COUNTRY_LABEL = {latvia:"拉脫維亞",estonia:"愛沙尼亞",lithuania:"立陶宛"};

let currentDay = 0;

function renderStamps(){
  const row = document.getElementById('stamprow');
  row.innerHTML = '';
  DAYS.forEach((d,i)=>{
    const el = document.createElement('div');
    el.className = 'stamp '+d.country+(i===currentDay?' active':'');
    el.innerHTML = '<div class="d">'+d.day+'</div><div class="m">'+d.date.split(' ')[0]+'</div>';
    el.addEventListener('click',()=>{currentDay=i;render();});
    row.appendChild(el);
  });
}

function renderCard(){
  const d = DAYS[currentDay];
  const card = document.getElementById('daycard');
  let blocksHtml = d.blocks.map(b=>{
    let metaHtml = b.meta && b.meta.length ? '<div class="meta">'+b.meta.map(m=>'<span>'+m+'</span>').join('')+'</div>' : '';
    return '<div class="block"><div class="time">'+b.time+'</div><div class="body"><div class="act">'+b.act+'</div>'+metaHtml+'</div></div>';
  }).join('');
  card.innerHTML =
    '<div class="top"><span class="daylabel">DAY '+d.day+' / 18</span><span class="date">'+d.date+'</span></div>'+
    '<h2>'+d.city+'</h2>'+
    '<span class="tag '+d.country+'">'+COUNTRY_LABEL[d.country]+'</span>'+
    '<div class="stay">下榻：<b>'+d.stay+'</b></div>'+
    '<div class="theme">'+d.theme+'</div>'+
    '<div class="blocks">'+blocksHtml+'</div>';
}

function render(){
  renderStamps();
  renderCard();
  document.getElementById('prevBtn').disabled = currentDay===0;
  document.getElementById('nextBtn').disabled = currentDay===DAYS.length-1;
}

document.getElementById('prevBtn').addEventListener('click',()=>{if(currentDay>0){currentDay--;render();}});
document.getElementById('nextBtn').addEventListener('click',()=>{if(currentDay<DAYS.length-1){currentDay++;render();}});

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
  });
});

render();

let travelers = ['旅伴 A','旅伴 B','旅伴 C'];
let expenses = [];
let paidByIdx = 0;
let splitOn = [true,true,true];

async function loadState(){
  try{
    const t = await window.storage.get('baltic-trip-travelers');
    if(t && t.value){ travelers = JSON.parse(t.value); }
  }catch(e){}
  try{
    const ex = await window.storage.get('baltic-trip-expenses');
    if(ex && ex.value){ expenses = JSON.parse(ex.value); }
  }catch(e){}
  document.getElementById('t0').value = travelers[0];
  document.getElementById('t1').value = travelers[1];
  document.getElementById('t2').value = travelers[2];
  renderExpenseUI();
}

async function saveTravelers(){
  try{ await window.storage.set('baltic-trip-travelers', JSON.stringify(travelers)); }catch(e){}
}
async function saveExpenses(){
  try{ await window.storage.set('baltic-trip-expenses', JSON.stringify(expenses)); }catch(e){}
}

['t0','t1','t2'].forEach((id,i)=>{
  document.getElementById(id).addEventListener('input',(e)=>{
    travelers[i] = e.target.value || ('旅伴 '+String.fromCharCode(65+i));
    saveTravelers();
    renderExpenseUI();
  });
});

function renderPaidbyRow(){
  const row = document.getElementById('paidbyRow');
  row.innerHTML = '';
  travelers.forEach((name,i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip-select'+(i===paidByIdx?' on':'');
    chip.textContent = name || ('旅伴 '+String.fromCharCode(65+i));
    chip.addEventListener('click',()=>{ paidByIdx=i; renderPaidbyRow(); });
    row.appendChild(chip);
  });
}

function renderSplitRow(){
  const row = document.getElementById('splitRow');
  row.innerHTML = '';
  travelers.forEach((name,i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip-select'+(splitOn[i]?' on':'');
    chip.textContent = name || ('旅伴 '+String.fromCharCode(65+i));
    chip.addEventListener('click',()=>{ splitOn[i]=!splitOn[i]; renderSplitRow(); });
    row.appendChild(chip);
  });
}

document.getElementById('addExpenseBtn').addEventListener('click',async ()=>{
  const desc = document.getElementById('descInput').value.trim();
  const amt = parseFloat(document.getElementById('amtInput').value);
  const errEl = document.getElementById('formError');
  if(!desc || isNaN(amt) || amt<=0 || !splitOn.some(Boolean)){
    errEl.textContent = '請填寫項目名稱、正確金額，並至少選擇一位分攤對象。';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  expenses.push({
    id: Date.now(),
    desc: desc,
    amount: Math.round(amt*100)/100,
    paidBy: paidByIdx,
    split: splitOn.slice()
  });
  document.getElementById('descInput').value = '';
  document.getElementById('amtInput').value = '';
  await saveExpenses();
  renderExpenseUI();
});

async function deleteExpense(id){
  expenses = expenses.filter(e=>e.id!==id);
  await saveExpenses();
  renderExpenseUI();
}

function fmt(n){
  return '€'+ (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function renderLedger(){
  const body = document.getElementById('ledgerBody');
  const empty = document.getElementById('ledgerEmpty');
  body.innerHTML = '';
  if(expenses.length===0){ empty.style.display='block'; return; }
  empty.style.display='none';
  expenses.slice().reverse().forEach(e=>{
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>'+e.desc+'</td>'+
      '<td>'+(travelers[e.paidBy]||'—')+'</td>'+
      '<td class="amt">'+fmt(e.amount)+'</td>'+
      '<td class="del"><button data-id="'+e.id+'">刪除</button></td>';
    body.appendChild(tr);
  });
  body.querySelectorAll('button[data-id]').forEach(btn=>{
    btn.addEventListener('click',()=>deleteExpense(Number(btn.dataset.id)));
  });
}

function computeBalances(){
  const paid = [0,0,0];
  const owe = [0,0,0];
  expenses.forEach(e=>{
    paid[e.paidBy] += e.amount;
    const n = e.split.filter(Boolean).length;
    if(n===0) return;
    const share = e.amount/n;
    e.split.forEach((on,i)=>{ if(on) owe[i]+=share; });
  });
  return travelers.map((name,i)=>({
    name: name || ('旅伴 '+String.fromCharCode(65+i)),
    balance: Math.round((paid[i]-owe[i])*100)/100
  }));
}

function renderBalances(){
  const grid = document.getElementById('balanceGrid');
  const balances = computeBalances();
  grid.innerHTML = balances.map(b=>{
    let cls = 'zero';
    if(b.balance>0.004) cls='pos';
    else if(b.balance<-0.004) cls='neg';
    const label = b.balance>0.004 ? '應收' : (b.balance<-0.004 ? '應付' : '已結清');
    return '<div class="balcard"><div class="name">'+b.name+'</div><div class="val '+cls+'">'+fmt(Math.abs(b.balance))+'</div><div class="split-label">'+label+'</div></div>';
  }).join('');
}

function renderSettlement(){
  const list = document.getElementById('settleList');
  const balances = computeBalances().map(b=>({name:b.name,bal:b.balance}));
  const creditors = balances.filter(b=>b.bal>0.004).sort((a,b)=>b.bal-a.bal);
  const debtors = balances.filter(b=>b.bal<-0.004).sort((a,b)=>a.bal-b.bal);
  const lines = [];
  let ci=0, di=0;
  const c = creditors.map(x=>({...x}));
  const d = debtors.map(x=>({...x}));
  while(ci<c.length && di<d.length){
    const amt = Math.min(c[ci].bal, -d[di].bal);
    if(amt>0.004){
      lines.push(d[di].name+' <span class="arrow">→</span> '+c[ci].name+' &nbsp; '+fmt(amt));
    }
    c[ci].bal -= amt;
    d[di].bal += amt;
    if(c[ci].bal<=0.004) ci++;
    if(d[di].bal>=-0.004) di++;
  }
  list.innerHTML = lines.length
    ? lines.map(l=>'<div class="settle-line">'+l+'</div>').join('')
    : '<div class="empty">目前帳目已平衡，或尚無支出紀錄。</div>';
}

function renderExpenseUI(){
  renderPaidbyRow();
  renderSplitRow();
  renderLedger();
  renderBalances();
  renderSettlement();
}

loadState();
</script>
